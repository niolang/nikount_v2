# Production : PostgreSQL + API + Caddy (front statique, reverse proxy /api, HTTPS automatique).
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm api node dist/db/migrate.js
#   docker compose -f docker-compose.prod.yml up -d
# Variables requises dans .env : POSTGRES_PASSWORD, SITE_ADDRESS (ex. nikount.app), PUBLIC_BASE_URL.
name: nikount

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nikount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:-nikount}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    # Aucun port publié : la base n'est joignable que depuis le réseau interne.

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-nikount}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nikount}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: '1'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL est requis}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS est requis}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
