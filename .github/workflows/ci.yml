name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/api.Dockerfile -t nikount-api .
      - run: docker build -f docker/web.Dockerfile -t nikount-web .
      - name: Valider le Caddyfile
        run: docker run --rm -e SITE_ADDRESS=localhost nikount-web caddy validate --config /etc/caddy/Caddyfile
      - name: Valider les fichiers Compose
        run: |
          POSTGRES_PASSWORD=x SITE_ADDRESS=localhost PUBLIC_BASE_URL=https://localhost \
            docker compose -f docker-compose.prod.yml config --quiet
          docker compose config --quiet
